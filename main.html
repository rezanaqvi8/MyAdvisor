<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Mobile optimizations-->

    <title>MyAdvisor</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header>
        <h1>MyAdvisor</h1>
        <p>Plan your semesters and track your major requirements.</p>
    </header>

    <main>
        <section>
            <h2>What college do you attend?</h2>

            <label for="school">College: </label>

            <select id="school">
                <option value="" selected disabled>Select a college...</option>
                <option value="furman">Furman University</option>
            </select>
        </section>

        <section id="majorSection" hidden>
            <h2>What is your major?</h2>

            <label for="majorSelect">Major:</label>

            <select id="majorSelect">
                <option value="" selected disabled>Select a major...</option>
            </select>
        </section>

        <section id="semesterSection" hidden>
            <h2>Add a Semester</h2>

            <label for="termSelect">Term:</label>
            <select id="termSelect">
                <option value="" selected disabled>Select a term...</option>
            </select>

            <label for="yearInput">Year:</label>
            <input
                type="number"
                id="yearInput"
                min="1990"
            >

            <button id="addSemesterButton">Add Semester</button>
        </section>

        <section id="plan" hidden>
            <h2>Your Plan</h2>

            <div id="semesterList">
                <p>No semesters added yet.</p>
            </div>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
